name: Verify product
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright'; console.log('CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Verify browser flow with saved fixtures
        shell: bash
        env:
          PORT: '4174'
          TEST_ORIGIN: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          npm start > /tmp/staypilot-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$TEST_ORIGIN/api/health" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/staypilot-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/staypilot-server.log
            exit 1
          fi
          npm run test:e2e:fixtures
